# Kamal deployment configuration for elitelouise.com
#
# Deploys run automatically from GitHub Actions (.github/workflows/deploy.yml),
# or manually with: bin/kamal deploy

service: soshop
image: mike-solmatic/soshop

servers:
  web:
    - 52.77.195.94

# kamal-proxy terminates TLS with automatic Let's Encrypt certificates.
proxy:
  ssl: false
  hosts:
    - elitelouise.com
    - www.elitelouise.com
  app_port: 80
  healthcheck:
    path: /up

# Images are stored in GitHub Container Registry (free with your account).
# KAMAL_REGISTRY_PASSWORD is a GitHub PAT with read:packages + write:packages.
registry:
  server: ghcr.io
  username: mike-solmatic
  password:
    - KAMAL_REGISTRY_PASSWORD

# t4g instances are ARM (Graviton).
builder:
  arch: arm64
  cache:
    type: gha

env:
  secret:
    - RAILS_MASTER_KEY
    - FACEBOOK_APP_ID
    - FACEBOOK_APP_SECRET
    - LITESTREAM_ACCESS_KEY_ID
    - LITESTREAM_SECRET_ACCESS_KEY
  clear:
    # Run Solid Queue's job supervisor inside Puma (single-server setup)
    SOLID_QUEUE_IN_PUMA: true
    # 2 GB instance: 1 Puma worker with 3 threads is the sweet spot
    WEB_CONCURRENCY: 1
    # Continuous SQLite replication to S3 (leave unset to disable Litestream)
    LITESTREAM_REPLICA_BUCKET: elitelouise-backups
    LITESTREAM_REPLICA_REGION: us-east-1

# SQLite databases and Active Storage uploads live on a named Docker volume
# so they survive deploys and container restarts.
volumes:
  - "soshop_storage:/rails/storage"

# Bridge fingerprinted assets between versions during deploys.
asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs --follow
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
